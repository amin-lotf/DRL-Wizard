[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drl-wizard"
version = "0.1.3"
description = "Deep Reinforcement Learning training platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amin Lotfolahi" }]




# core dependencies (you can adjust later)
dependencies = [
    # Core runtime deps
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "tensorboard>=2.14",
    "gymnasium[atari,mujoco]>=0.29",
    "gymnasium-robotics>=1.2",
    "mpe2>=0.0.1", # ensure this exists on PyPI
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "stable-baselines3>=2.3",
    "ale-py>=0.10",
    "opencv-python>=4.9",
    "streamlit>=1.38",
    "pandas-stubs>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]



[tool.hatch.build.targets.wheel]
packages = ["src/drl_wizard"]


[tool.coverage.run]
source = ["src"]
include = ["drl_wizard*"]
omit = ["*/tests/*", "*/test_*.py"]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]


[project.urls]
Homepage = "https://github.com/amin-lotf/DRL-Wizard"
